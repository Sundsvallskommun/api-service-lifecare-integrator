#========================================
# Test profile settings (junit tests)
#========================================
logging:
  level:
    root: DEBUG
integration:
  elderlycare:
    url: http://elderlycare.url
    domain: junit-domain
    key: junit-key
  familycare:
    url: http://familycare.url
    domain: junit-domain
    key: junit-key
  employee:
    url: http://employee.local
  party:
    url: http://party.local
    connect-timeout: 10
    read-timeout: 20
    cache-time-to-live: PT5M
    cache-maximum-size: 500
spring:
  security:
    oauth2:
      client:
        provider:
          employee:
            token-uri: http://token.url
          party:
            token-uri: http://token.url
        registration:
          employee:
            client-id: the-client-id
            client-secret: the-client-secret
          party:
            client-id: the-client-id
            client-secret: the-client-secret
