logging:
  level:
    root: INFO
openapi:
  name: ${spring.application.name}
  title: ${spring.application.name}
  version: '@project.version@'
spring:
  application:
    name: api-lifecare-integrator
  security:
    oauth2:
      client:
        registration:
          party:
            authorization-grant-type: client_credentials
            provider: party
          employee:
            authorization-grant-type: client_credentials
            provider: employee

integration:
  elderlycare:
    url: override-me
    domain: override-me
    key: override-me
  party:
    url: override-me
    cache-time-to-live: PT15M
    cache-maximum-size: 10000
  employee:
    url: override-me
  familycare:
    url: override-me
    domain: override-me
    key: override-me
  lifecare-professionalweb:
    url:
    domain:
    federation-profile:
    username:
    password:
    session-cookie:
    keep-alive-interval: 5m
    print:
      decision-template-id: 885bfb68-c97b-47c0-921d-ef00caaa2423
      calculation-template-id: 7936e9ec-e32a-40cf-9dea-d95b16e021f0
      document-template-id: b9f20b49-c8ba-4c44-ad33-b2bf8f0b688a

resilience4j:
  circuitbreaker:
    instances:
      elderlycare:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
      familycare:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
      employee:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
      lifecare-professionalweb:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem

logbook:
  excluded:
    paths: /**/professional-web/**
