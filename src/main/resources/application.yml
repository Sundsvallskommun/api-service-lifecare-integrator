#========================================
# General settings
#========================================
logging:
  level:
    root: INFO
openapi:
  name: ${spring.application.name}
  title: ${spring.application.name}
  version: '@project.version@'
spring:
  application:
    name: api-lifecare-integrator
  security:
    oauth2:
      client:
        registration:
          party:
            authorization-grant-type: client_credentials
            provider: party
          employee:
            authorization-grant-type: client_credentials
            provider: employee

#========================================
# Integrations
#========================================
integration:
  # Lifecare Welfare API Services / Elderly care (EC) — WE.EC.Integration.Host. Auth is domain + key as query
  # parameters, and the key goes nowhere else — EC rejects the request if it finds the key in a header too.
  # Either the percent-encoded or the decoded form of the key works. The key is a secret: override per
  # environment, never commit it.
  lifecare-ec:
    url: override-me
    domain: override-me
    key: override-me
  # api-service-party — partyId <-> personnummer. Both directions are cached in memory (never logged or persisted);
  # a partyId and its personnummer belong together for life, so the time to live only bounds how long the heap holds
  # them. A lookup Party cannot answer is never cached.
  party:
    url: override-me
    cache-time-to-live: PT15M
    cache-maximum-size: 10000
  # api-service-employee — puts a name to a Lifecare caseworker id. Only consulted when Lifecare sends a caseworker
  # without one, and never allowed to fail a decision read.
  employee:
    url: override-me
  # Lifecare FamilyCare (FC) — WESE.FC.Api.FC. Auth is domain + key. The /Users/* directory is licensed to a
  # SEPARATE consumer ("Användarinformation IFO") from the person-based case APIs ("API IFO Personbaserade").
  # Set user-key to that second key where the split applies; leave it unset (mocks, single-consumer tenants) and
  # key is used for every call. The two surfaces refuse the wrong key DIFFERENTLY, which is worth knowing before
  # debugging one of them: /Users answers 403 to a case key (observed 2026-09-22), while the person-based reads
  # answer 200 with an empty body to a user key — no status, no log line, nothing to notice.
  lifecare-fc:
    url: override-me
    domain: override-me
    key: override-me
    # user-key: override-me
  # Lifecare ProfessionalWeb — the internal api2 surface Lifecare's own web client uses, passed through for
  # api-service-caremanagement (POST /{municipalityId}/professional-web/exchange). Reached with a signed-in session of an
  # integration account (SAML via MobilityGuard), not an API key. url is the Lifecare host without a module path; unset
  # means every exchange answers 502. username/password are secrets.
  lifecare-professionalweb:
    url:
    domain:
    federation-profile:
    username:
    password:

resilience4j:
  circuitbreaker:
    instances:
      lifecare-ec:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
      lifecare-fc:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
      employee:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
