logging:
  level:
    root: INFO
openapi:
  name: ${spring.application.name}
  title: ${spring.application.name}
  version: '@project.version@'
spring:
  application:
    name: api-lifecare-integrator
  security:
    oauth2:
      client:
        registration:
          party:
            authorization-grant-type: client_credentials
            provider: party
          employee:
            authorization-grant-type: client_credentials
            provider: employee

integration:
  elderlycare:
    url: override-me
    domain: override-me
    key: override-me
  party:
    url: override-me
  employee:
    url: override-me
  familycare:
    url: override-me
    domain: override-me
    key: override-me
  lifecare-professionalweb:
    url:
    domain:
    federation-profile:
    username:
    password:
    session-cookie:
    keep-alive-interval: 5m

resilience4j:
  circuitbreaker:
    instances:
      elderlycare:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
      familycare:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
      employee:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
      lifecare-professionalweb:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem

logbook:
  excluded:
    paths: /**/professional-web/**
